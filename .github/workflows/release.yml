name: Build portable release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Project release version (e.g. 1.0.0). Empty = VERSION file"
        required: false
      opencode_version:
        description: "OpenCode V2 version (e.g. 2.2.6). Empty = OPENCODE_VERSION file"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Static checks
        run: bash scripts/smoke-test.sh --static

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve versions
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_OPENCODE_VERSION: ${{ inputs.opencode_version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="$INPUT_VERSION"
          if [ -z "$VER" ] && [ "$REF_TYPE" = "tag" ]; then
            VER="${REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER="$(cat VERSION)"
          fi
          OC_VER="$INPUT_OPENCODE_VERSION"
          if [ -z "$OC_VER" ]; then
            OC_VER="$(cat OPENCODE_VERSION)"
          fi
          if [ -z "$OC_VER" ]; then
            OC_VER="$(curl -fsSL --proto '=https' --proto-redir '=https' \
              'https://api.github.com/repos/anomalyco/opencode/releases?per_page=50' \
              | jq -r '[.[] | select(.prerelease == false) | select(.tag_name | test("^v2\\.[0-9]+\\.[0-9]+$"))] | sort_by(.tag_name | ltrimstr("v") | split(".") | map(tonumber)) | last | .tag_name')"
          fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad project version: $VER" >&2; exit 1; }
          OC_VER="${OC_VER#v}"
          [[ "$OC_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad OpenCode version: $OC_VER" >&2; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "opencode_version=$OC_VER" >> "$GITHUB_OUTPUT"

      - name: Build portable bundles
        env:
          OC_VERSION: ${{ steps.ver.outputs.opencode_version }}
        run: bash scripts/make-portable.sh "$OC_VERSION"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
          PROJECT_VERSION: ${{ steps.ver.outputs.version }}
          OC_VERSION: ${{ steps.ver.outputs.opencode_version }}
        run: |
          set -euo pipefail
          files=(release/opencode-portable-windows-x64.zip release/opencode-portable-linux-x64.tar.gz release/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" "${files[@]}" \
              --title "My-OpenCode-Portable $TAG" \
              --notes "Portable $PROJECT_VERSION, OpenCode $OC_VERSION." \
              --generate-notes \
              --latest
          fi
